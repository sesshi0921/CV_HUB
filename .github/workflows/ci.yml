name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatter checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Check C++ formatting
        shell: bash
        run: |
          mapfile -t files < <(git ls-files \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.mm' \
            ':!:third_party/**' \
            ':!:build/**' \
            ':!:apps/cvhub_gui/resources/app_icon_rgba.hpp')
          if (( ${#files[@]} )); then
            clang-format --dry-run --Werror "${files[@]}"
          fi

      - name: Check Python formatting
        run: ruff format --check plugins scripts

  lint:
    name: Linters
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            cmake \
            ninja-build \
            g++ \
            libgl1-mesa-dev \
            libglfw3-dev \
            libopencv-dev \
            libspdlog-dev \
            xorg-dev

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          npm install -g pyright

      - name: Configure CMake for clang-tidy
        run: |
          cmake -S . -B build/ci-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCVHUB_BUILD_PLUGIN_PYTORCH=OFF \
            -DCVHUB_BUILD_TESTS=ON

      - name: Run clang-tidy
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd().resolve()
          commands = json.loads(pathlib.Path("build/ci-tidy/compile_commands.json").read_text())
          lint_roots = ("apps/", "include/", "plugins/", "src/", "tests/")
          files = []
          for entry in commands:
              source = pathlib.Path(entry["file"]).resolve()
              try:
                  rel = source.relative_to(root).as_posix()
              except ValueError:
                  continue
              if not rel.startswith(lint_roots):
                  continue
              if "/_deps/" in rel or rel.startswith("third_party/"):
                  continue
              if rel.endswith("_auto_nodes.cpp"):
                  continue
              if source.suffix in {".cpp", ".cc", ".cxx"}:
                  files.append(str(source))

          if files:
              subprocess.run(["clang-tidy", "-p", "build/ci-tidy", "--quiet", *sorted(set(files))], check=True)
          PY

      - name: Run Python lint
        run: ruff check plugins scripts

      - name: Run Pyright
        run: pyright
